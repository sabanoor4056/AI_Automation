<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add New Lead</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0a0e1a;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }

    .page-wrap {
        width: 100%;
        max-width: 640px;
    }

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .section-label {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        color: #818cf8;
        text-transform: uppercase;
    }

    .top-bar h1 {
        font-size: 26px;
        color: #f3f4f6;
        margin-top: 4px;
    }

    .back-link {
        font-size: 14px;
        color: #a5b4fc;
        text-decoration: none;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .back-link:hover { text-decoration: underline; color: #c7d2fe; }

    .card {
        background: #131a2b;
        border-radius: 16px;
        padding: 36px 40px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        border: 1px solid #232d45;
    }

    .card p.subtitle {
        color: #9ca3af;
        font-size: 14px;
        margin-bottom: 28px;
    }

    .alert {
        padding: 12px 16px;
        border-radius: 10px;
        margin-bottom: 20px;
        font-size: 14px;
        font-weight: 500;
    }
    .alert-success { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
    .alert-error   { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }

    .form-group {
        margin-bottom: 20px;
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }

    label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #cbd5e1;
        margin-bottom: 7px;
    }
    label .required { color: #f87171; }

    input[type="text"],
    input[type="email"],
    select,
    textarea {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid #2a3350;
        border-radius: 10px;
        font-size: 14px;
        color: #e5e7eb;
        background: #0e1424;
        transition: all 0.15s ease;
        font-family: inherit;
    }

    input::placeholder, textarea::placeholder {
        color: #5b6478;
    }

    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #6366f1;
        background: #10182c;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    textarea {
        resize: vertical;
        min-height: 90px;
    }

    select {
        appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: right 14px center;
        background-size: 16px;
        padding-right: 40px;
    }

    select option {
        background: #131a2b;
        color: #e5e7eb;
    }

    .form-actions {
        display: flex;
        gap: 12px;
        margin-top: 28px;
        padding-top: 24px;
        border-top: 1px solid #232d45;
    }

    .btn-primary {
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        color: #fff;
        border: none;
        padding: 13px 28px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.1s ease, box-shadow 0.15s ease;
        box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }
    .btn-primary:hover {
        box-shadow: 0 6px 18px rgba(99, 102, 241, 0.45);
        transform: translateY(-1px);
    }

    .btn-secondary {
        background: #1c2438;
        color: #cbd5e1;
        border: 1px solid #2a3350;
        padding: 13px 24px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        transition: background 0.15s ease;
    }
    .btn-secondary:hover { background: #232d45; }
</style>
</head>
<body>

<div class="page-wrap">

    <div class="top-bar">
        <div>
            <div class="section-label">Customer Management</div>
            <h1>Add New Lead</h1>
        </div>
        <a href="{% url 'leads' %}" class="back-link">&larr; Back to Leads</a>
    </div>

    <div class="card">
        <p class="subtitle">Fill in the details below to add a new lead to your pipeline.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Full Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" value="{{ form_data.name|default:'' }}" placeholder="e.g. Ahmed Khan" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="{{ form_data.email|default:'' }}" placeholder="ahmed@example.com">
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="text" id="phone" name="phone" value="{{ form_data.phone|default:'' }}" placeholder="0300-1234567">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="company">Company</label>
                    <input type="text" id="company" name="company" value="{{ form_data.company|default:'' }}" placeholder="Acme Inc.">
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        {% for value, label in status_choices %}
                            <option value="{{ value }}" {% if form_data.status == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes" placeholder="Any additional notes about this lead...">{{ form_data.notes|default:'' }}</textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Save Lead</button>
                <a href="{% url 'leads' %}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>

</div>

</body>
</html>
