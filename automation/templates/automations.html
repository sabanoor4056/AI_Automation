{% extends "base.html" %}

{% block title %}Create Automation - AI Automation{% endblock %}

{% block content %}

<style>

.create-page {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 25px;
}

.create-header {
    margin-bottom: 30px;
}

.create-header .badge {
    color: #38bdf8;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1.5px;
}

.create-header h1 {
    font-size: 32px;
    margin: 8px 0;
}

.create-header p {
    color: #94a3b8;
}

.form-card {
    background: #111827;
    border: 1px solid #263244;
    border-radius: 16px;
    padding: 30px;
}

.form-group {
    margin-bottom: 22px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    color: #cbd5e1;
    font-size: 14px;
    font-weight: 600;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    padding: 13px 15px;
    background: #0b1120;
    border: 1px solid #334155;
    border-radius: 9px;
    color: white;
    font-size: 14px;
    outline: none;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
    border-color: #38bdf8;
}

.form-group textarea {
    min-height: 120px;
    resize: vertical;
}

.form-actions {
    display: flex;
    gap: 12px;
    margin-top: 30px;
}

.create-btn {
    background: #0284c7;
    color: white;
    border: none;
    padding: 13px 22px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: bold;
}

.create-btn:hover {
    background: #0369a1;
}

.cancel-btn {
    background: #172033;
    color: #cbd5e1;
    text-decoration: none;
    padding: 13px 22px;
    border-radius: 9px;
}

.cancel-btn:hover {
    color: #38bdf8;
}

</style>


<div class="create-page">

    <div class="create-header">

        <div class="badge">
            AUTOMATION BUILDER
        </div>

        <h1>Create Automation</h1>

        <p>
            Create an automated workflow for your business.
        </p>

    </div>


    <div class="form-card">

        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label>Automation Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Example: Lead Follow-up"
                    required
                >

            </div>


            <div class="form-group">

                <label>Description</label>

                <textarea
                    name="description"
                    placeholder="Describe what this automation should do..."
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label>Trigger</label>

                <select name="trigger" required>

                    <option value="">Select a trigger</option>

                    <option value="New Lead">
                        New Lead
                    </option>

                    <option value="New Customer">
                        New Customer
                    </option>

                    <option value="New Message">
                        New Message
                    </option>

                    <option value="Scheduled Time">
                        Scheduled Time
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Action</label>

                <select name="action" required>

                    <option value="">Select an action</option>

                    <option value="Send Email">
                        Send Email
                    </option>

                    <option value="Send AI Response">
                        Send AI Response
                    </option>

                    <option value="Create Lead">
                        Create Lead
                    </option>

                    <option value="Update Customer">
                        Update Customer
                    </option>

                </select>

            </div>


            <div class="form-actions">

                <button type="submit" class="create-btn">
                    ⚡ Create Automation
                </button>

                <a href="{% url 'automations' %}" class="cancel-btn">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
