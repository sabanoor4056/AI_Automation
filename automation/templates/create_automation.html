<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Automation | AI Automation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1e293b;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #dbe1ea;
            border-radius: 10px;
            margin-bottom: 22px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="{% url 'dashboard' %}" class="back">
        ← Back to Dashboard
    </a>

    <div class="card">

        <h1>Create New Automation</h1>

        <p class="subtitle">
            Create an AI-powered workflow for your business tasks.
        </p>

        <form>

            <label>Automation Name</label>
            <input
                type="text"
                placeholder="Example: Lead Follow-up Automation"
            >

            <label>Automation Type</label>

            <select>
                <option>Email Automation</option>
                <option>Lead Generation</option>
                <option>Customer Support</option>
                <option>Data Processing</option>
                <option>AI Assistant</option>
            </select>

            <label>Description</label>

            <textarea
                placeholder="Describe what you want this automation to do..."
            ></textarea>

            <button type="button" onclick="createAutomation()">
                Create Automation
            </button>

        </form>

    </div>

</div>

<script>

function createAutomation() {

    alert("Automation setup created successfully!");

}

</script>

</body>
</html>
